<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Finder | Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">
        <div class="shield">
          <span>LF</span>
        </div>

        <div class="logo-text">
          <h1>League Finder</h1>
          <p>Find. Play. Compete.</p>
        </div>
      </div>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="leagues.html">Browse Leagues</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <section class="auth-section">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p>Register to join leagues or create your own.</p>

      <form id="register-form">

  <input
    type="text"
    id="name"
    placeholder="Full Name"
    required
  >

  <input
    type="email"
    id="email"
    placeholder="Email Address"
    required
  >

  <input
    type="text"
    id="location"
    placeholder="Location"
  >

  <select id="favorite-sport" required>
    <option value="">Select Favorite Sport</option>
    <option value="Basketball">Basketball</option>
    <option value="Flag Football">Flag Football</option>
    <option value="Soccer">Soccer</option>
    <option value="Volleyball">Volleyball</option>
  </select>

  <select id="skill-level" required>
    <option value="">Select Skill Level</option>
    <option value="Beginner">Beginner</option>
    <option value="Intermediate">Intermediate</option>
    <option value="Advanced">Advanced</option>
  </select>

  <input
    type="password"
    id="password"
    placeholder="Password"
    minlength="8"
    required
  >

  <input
    type="password"
    id="confirm-password"
    placeholder="Confirm Password"
    minlength="8"
    required
  >

  <select id="account-type" required>
    <option value="">Select Account Type</option>
    <option value="CUSTOMER">Player</option>
    <option value="PROVIDER">Provider</option>
  </select>

  <button type="submit">Create Account</button>

  <p id="message"></p>

</form>

      <p class="auth-link">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 League Finder. All rights reserved.</p>
  </footer>
<script src="js/register.js?v=100"></script>
</body>
</html>
