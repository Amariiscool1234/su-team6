<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>League Finder | Customer Profile</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/customer-profile.js" defer></script>
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <div class="shield">
                <span>LF</span>
            </div>

            <div class="logo-text">
                <h1>League Finder</h1>
                <p>Find. Play. Compete.</p>
            </div>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="leagues.html">Browse Leagues</a></li>
            <li><a href="teams.html">Teams</a></li>
            <li><a href="customer-profile.html">Profile</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="profile-page">
    <div class="profile-container">

        <div class="profile-card">
            <div class="profile-avatar">DA</div>

            <div>
                <h2>Customer Profile</h2>
                <p>Manage your sports preferences and availability.</p>
            </div>
        </div>

        <div class="profile-header">
            <h1>My Profile</h1>
            <p>
                Update your information to find teams that match
                your interests.
            </p>
        </div>

        <form id="profile-form" class="profile-form">
            <input type="hidden" id="customer-id">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location">
            </div>

            <div class="form-group">
                <label for="favorite-sport">Favorite Sport</label>

                <select id="favorite-sport">
                    <option value="Basketball">Basketball</option>
                    <option value="Flag Football">Flag Football</option>
                    <option value="Soccer">Soccer</option>
                    <option value="Volleyball">Volleyball</option>
                </select>
            </div>

            <div class="form-group">
                <label for="skill-level">Skill Level</label>

                <select id="skill-level">
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">
                        Intermediate
                    </option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

            <div class="profile-actions">
                <button type="submit" class="profile-button">
                    Save Profile
                </button>

                <button
                    type="reset"
                    class="profile-button secondary"
                >
                    Clear Form
                </button>
            </div>

            <p id="message"></p>
        </form>

    </div>
</main>
<script src="js/player-profile.js?v=2"></script>
</body>
</html>
