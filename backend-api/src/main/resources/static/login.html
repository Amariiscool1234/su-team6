<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>League Finder | Home </title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

  <header>
    <nav class="navbar">
      <div class="logo">
    <div class="shield">
        <span>LF</span>
    </div>

    <div class="logo-text">
        <h1>League Finder</h1>
        <p>Find. Play. Compete.</p>
    </div>
         </div>

         <ul class = "nav-links">
           <li><a href ="index.html">Home</a></li>
           <li><a href ="leagues.html">Leagues</a></li>
           <li><a href ="about.html">About</a></li>
           <li><a href ="register.html">Register</a></li>
          
         </ul>
     </nav>
    </header>

       <section class="auth-section">
          <div class="auth-card">
               <h2>Login</h2>
               <p> Welcome back. Sign in to find or mangage leagues/team in your area.</p>
              <form action="/login" method="post">

    <label for="email">Email</label>
    <input
        type="email"
        name="username"
        placeholder="email"
        required
    >

    <label for="password">Password</label>
    <input
        type="password"
        name="password"
        placeholder="password"
        required
    >

    <button type="submit">Log In</button>

    <p id="login-message"></p>
</form>

<script>
    const params = new URLSearchParams(window.location.search);

    if (params.has("error")) {
        document.getElementById("login-message").textContent =
            "Incorrect email or password.";
    }

    if (params.has("logout")) {
        document.getElementById("login-message").textContent =
            "You have been logged out.";
    }
</script>

                <p class="auth-link">
                     Dont have an account? <a href = "register.html">Register here</a>
                       
                </p>
                <a href="player-dashboard.html" class="btn primary">
                 Login as Player
                </a>

                <a href="organizer-dashboard.html" class="btn secondary">
                  Login as Organizer
                </a>
          </div>
       </section>

         <footer>
             <p>&copy;  2026 League Finder. All rights reserved.</p>
         </footer>
        
            
        
</body>
</html>
